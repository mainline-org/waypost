name = "waypost"
main = "build/index.js"
compatibility_date = "2026-07-17"
workers_dev = true

[build]
command = "worker-build --release --no-default-features --features cloudflare"

[vars]
PUBLIC_ORIGIN = "http://127.0.0.1:8791"

[[d1_databases]]
binding = "DB"
database_name = "waypost"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "waypost-objects"
