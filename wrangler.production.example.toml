# Copy to wrangler.production.toml and configure your own account/resources.
name = "waypost-production"
account_id = "replace-with-your-account-id"
main = "build/index.js"
compatibility_date = "2026-07-17"
workers_dev = true
preview_urls = false

[build]
command = "worker-build --release --no-default-features --features cloudflare"

[vars]
DEPLOYMENT_ENV = "production"
PUBLIC_ORIGIN = "https://waypost-production.your-subdomain.workers.dev"

[observability]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "DB"
database_name = "waypost-production"
database_id = "replace-with-your-database-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "OBJECTS"
bucket_name = "waypost-production-objects"

# Use namespaces unique to this application within your account.
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 300
period = 60
