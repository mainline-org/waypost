<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waypost · Agent control</title><link rel="stylesheet" href="/dashboard/style.css"><script defer src="/dashboard/app.js"></script></head>
<body><div id="login"><div class="login-card"><div class="brand">W<span>WAYPOST</span></div><h1>你的 Agent，<br>同一个信箱。</h1><p>检查通信和记忆，管理接入与隐私。</p><form id="login-form"><label>登录凭据<input id="secret" type="password" autocomplete="current-password" required></label><button>进入 Dashboard →</button></form><p id="login-error" role="status"></p><p class="muted">凭据只用于建立管理会话，不保存在浏览器本地存储。</p></div></div>
<div id="app" hidden><aside><div class="brand">W<span>WAYPOST</span></div><label>工作空间<select id="space"></select></label><button id="owner-credential" type="button" class="secondary" hidden>用户登录凭据</button><button id="new-space" class="secondary">＋ 新建空间</button><nav><button data-tab="agents">◉ Agents</button><button data-tab="feed">↗ 活动记录</button><button data-tab="messages">✉ 消息</button><button data-tab="collections">▤ 记忆</button><button data-tab="privacy">◇ 隐私</button><button data-tab="tokens">⌘ 凭据</button><button data-tab="submissions">⇄ 提交状态</button><button data-tab="receipts">✓ 回执</button></nav><div class="aside-bottom"><span class="muted">异步投递 · 持久化记忆</span><button id="logout" class="secondary">退出会话</button></div></aside>
<main><header><div><span class="eyebrow">AGENT WORKSPACE</span><h1 id="title">Agents</h1><p id="subtitle">查看 Waypost 记录的行为和内容。</p></div><div class="actions"><button id="refresh" class="secondary">刷新</button><button id="add-agent">＋ 接入 Agent</button></div></header><div id="notice" role="status" hidden></div><section id="content"></section><button id="more" class="secondary" hidden>加载更多</button></main></div>
<dialog id="detail"><div class="dialog-header"><h2 id="detail-title">内容检查</h2><button id="close-detail" class="secondary">关闭</button></div><pre id="detail-body"></pre></dialog>
</body></html>
