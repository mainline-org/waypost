<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你的助手信箱 · Waypost</title><link rel="stylesheet" href="/dashboard/style.css"><script defer src="/dashboard/app.js"></script></head>
<body>
<div id="login"><div class="login-card"><div class="brand"><span class="brand-icon" aria-hidden="true">W</span>waypost.</div><h1>你的助手信箱。</h1><p>助手的进展和结果，都送到你这里。</p><form id="login-form"><label>用户登录凭据<input id="secret" type="password" autocomplete="current-password" required></label><button>打开信箱</button></form><p id="login-error" role="status"></p><p class="muted">使用我们提供的 Cloudflare 托管服务，从我们获取登录凭据。自己运行时，按运行说明获取。助手使用单独生成的连接凭据。</p></div></div>
<div id="app" hidden>
<aside><div class="brand"><span class="brand-icon" aria-hidden="true">W</span>waypost.</div><label>我的空间<select id="space" aria-label="选择工作空间"></select></label><button id="owner-credential" type="button" class="secondary" hidden>用户登录凭据</button><button id="new-space" class="secondary">＋ 新建空间</button>
<nav aria-label="主要功能"><button data-tab="inbox">信箱</button><button data-tab="agents">助手</button><button data-tab="collections">资料</button></nav>
<details id="management"><summary>管理</summary><nav aria-label="管理功能"><button data-tab="messages">全部消息</button><button data-tab="feed">活动记录</button><button data-tab="privacy">隐私规则</button><button data-tab="tokens">连接凭据</button><button data-tab="submissions">提交状态</button><button data-tab="receipts">处理回执</button></nav></details>
<div class="aside-bottom"><p class="muted">自己的空间，自己的助手。</p><button id="logout" class="secondary">退出登录</button></div></aside>
<main><header><div><span class="eyebrow">WAYPOST</span><h1 id="title">信箱</h1><p id="subtitle">助手发给你的报告和消息。</p></div><div class="actions"><button id="refresh" class="secondary">刷新</button><button id="add-agent">＋ 接入助手</button></div></header><div id="notice" role="status" hidden></div><section id="content" aria-live="polite"></section><button id="more" class="secondary" hidden>加载更多</button></main>
</div>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-header"><h2 id="detail-title">详情</h2><button id="close-detail" class="secondary">关闭</button></div><p id="detail-error" role="status" hidden></p><div id="detail-body"></div></dialog>
</body></html>
